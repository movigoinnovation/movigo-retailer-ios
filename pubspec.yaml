name: movigo
description: "Movigo Customer App"
publish_to: "none"
version: 1.3.0+48

environment:
  sdk: ">=3.3.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  shimmer: ^3.0.0
  table_calendar: ^3.1.0
  get: ^4.7.2
  fluttertoast: ^9.0.0
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.1.5
  pinput: ^5.0.0
  dotted_border: ^2.1.0
  razorpay_flutter: ^1.3.7
  http: ^1.2.1
  http_parser: ^4.0.2
  socket_io_client: ^3.0.2
  pusher_channels_flutter: ^2.0.0
  dropdown_button2: ^2.3.9
  path_provider: ^2.1.4
  provider: ^6.1.1
  intl: ^0.20.2
  carousel_slider: ^4.0.0
  loading_animation_widget: ^1.2.1
  readmore: ^2.2.0
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  share_plus: ^10.1.4
  webview_flutter: ^4.13.1
  google_maps_flutter: ^2.9.0
  geolocator: ^9.0.2
  geocoding: ^2.2.2
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9+2   # contacts picker for receiver/sender fields
  pdf: ^3.11.1
  printing: ^5.13.2
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.1.0
  firebase_core: ^3.15.0
  flutter_local_notifications: ^17.2.4
  firebase_database: ^11.1.1
  firebase_crashlytics: ^4.1.3
  keep_screen_on: ^4.0.0
  video_player: ^2.11.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Force transitive deps that use removed Flutter v1 embedding to latest versions
dependency_overrides:
  flutter_plugin_android_lifecycle: ^2.0.34
  path_provider_android: ^2.2.12
  shared_preferences_android: ^2.4.23
  url_launcher_android: ^6.3.29
  image_picker_android: ^0.8.13+16
  webview_flutter_android: ^4.11.0
  geolocator_android: ^4.6.1
  permission_handler_android: ^12.0.13

flutter:
  uses-material-design: true

  config:
    enable-swift-package-manager: false

  assets:
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Thin.ttf
        - asset: assets/fonts/poppins/Poppins-ThinItalic.ttf
          style: italic
          weight: 100
        - asset: assets/fonts/poppins/Poppins-ExtraLight.ttf
        - asset: assets/fonts/poppins/Poppins-ExtraLightItalic.ttf
          style: italic
          weight: 200
        - asset: assets/fonts/poppins/Poppins-Light.ttf
        - asset: assets/fonts/poppins/Poppins-LightItalic.ttf
          style: italic
          weight: 300
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
        - asset: assets/fonts/poppins/Poppins-MediumItalic.ttf
          style: italic
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
        - asset: assets/fonts/poppins/Poppins-SemiBoldItalic.ttf
          style: italic
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
        - asset: assets/fonts/poppins/Poppins-BoldItalic.ttf
          style: italic
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
        - asset: assets/fonts/poppins/Poppins-ExtraBoldItalic.ttf
          style: italic
          weight: 800

    - family: Platypi
      fonts:
        - asset: assets/fonts/Platypi/Platypi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Platypi/Platypi-Italic.ttf
          style: italic
        - asset: assets/fonts/Platypi/Platypi-Light.ttf
          weight: 300
        - asset: assets/fonts/Platypi/Platypi-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Platypi/Platypi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Platypi/Platypi-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Platypi/Platypi-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Platypi/Platypi-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Platypi/Platypi-Bold.ttf
          weight: 700
        - asset: assets/fonts/Platypi/Platypi-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Platypi/Platypi-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Platypi/Platypi-ExtraBoldItalic.ttf
          weight: 800
          style: italic

    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans/OpenSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans/OpenSans-ExtraBold.ttf
          weight: 800
